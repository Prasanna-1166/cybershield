{% extends "base.html" %}
{% block title %}Level {{ level.number }}{% endblock %}
{% block content %}
<div class="container py-5 text-center">
    <h1 class="h4">Level {{ level.number }}: {{ level.name }}</h1>
    <p class="text-muted">This level doesn't have any challenges yet. Run the seed script to add them.</p>
    <a href="{{ url_for('game.levels') }}" class="btn cs-btn-accent">Back to levels</a>
</div>
{% endblock %}
